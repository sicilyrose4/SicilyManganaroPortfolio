    <!-- data-password-gate: the project this unlocks (Social Block shares the Workshop password and unlock); data-next: where to go once unlocked -->
    <section class="lock" data-password-gate="workshop" data-next="social-block.html">
      <img class="lock__art" data-reveal src="assets/images/lock/password-protected.png" width="300" height="426" alt="Hand-drawn padlock">
      <h1 class="lock__title" data-reveal>This project is password protected.</h1>
      <form class="lock__form" data-reveal novalidate>
        <div class="lock__field">
          <label class="visually-hidden" for="project-password">Password</label>
          <input class="lock__input" id="project-password" name="password" type="password" placeholder="Enter password" autocomplete="off" aria-describedby="password-hint" autofocus>
          <p class="lock__error" role="alert" aria-live="assertive"></p>
          <p class="lock__hint" id="password-hint">The password is at the top of my resume<br><span class="lock__hint-desk">(top right of the home page).</span><span class="lock__hint-phone">(in the navigation menu).</span></p>
        </div>
        <button class="outline-button lock__submit" type="submit">ENTER</button>
      </form>
    </section>
