    <header class="case__intro drop-intro">
      <h1 class="case__title" data-reveal>Drop Drone Delivery Dashboard</h1>
      <p class="case__summary" data-reveal>A dashboard designed to be used by the operation manager of a fleet of delivery drones. Created to provide quick insights along with in-depth information.</p>
    </header>

    <!-- Frame "Drop Drone" (clip content). Boards are Figma exports at 2x, stacked edge to edge. -->
    <div class="case__body">
      <img data-reveal class="case__media" src="assets/images/drop/01-title.jpg" width="2044" height="1150" alt="The Drop logo, a drop-shaped mark beside the word drop, with the tagline Direct Flight, Direct Delivery. Sicily Manganaro, IXD 404, Dashboard Design.">
      <img data-reveal class="case__media" src="assets/images/drop/02-cover.jpg" width="2044" height="1150" alt="The Drop dashboard shown on a stack of laptop screens.">
      <img data-reveal class="case__media" src="assets/images/drop/03-concept.jpg" width="2044" height="948" alt="Concept. This dashboard accompanies a self-automated drone delivery app. The user focused app would be a drone-powered delivery platform that allows customers to place orders and track their packages as drones transport them. The dashboard is the admin side of the app, designed for an operations manager to monitor the entire fleet of drones: tracking drone locations, monitoring deliveries, and watching battery and maintenance. Shown beside a drone carrying a Drop package.">
      <img data-reveal class="case__media" src="assets/images/drop/04-user.jpg" width="2044" height="1150" alt="The User. Persona: a drone fleet operations manager who keeps deliveries on schedule, tracks drone health, and responds quickly to delays or malfunctions. Their questions: How efficient is the fleet overall? Which deliveries are on time or delayed? Where is every drone right now and what is it carrying? Is drone performance changing over time? Are any drones low on battery or having technical issues? Quotes: I can't see the big picture of the current drone activity fast enough. It takes too long to find info on a specific drone. I wish I could quickly compare performance over time.">
      <img data-reveal class="case__media" src="assets/images/drop/05-goal.jpg" width="2044" height="769" alt="Project Goal: create a clean, real-time dashboard that shows the most critical information quickly, with drill-down options for deeper insights.">
      <img data-reveal class="case__media" src="assets/images/drop/06-lowfi.jpg" width="2044" height="1150" alt="Low fidelity designs: two wireframe dashboards annotated with main KPIs, interactive maps, all fleet numbers, delivery stats, a drone information table, and drone-specific battery information.">
      <img data-reveal class="case__media" src="assets/images/drop/07-wireframes.jpg" width="2044" height="1150" alt="Wireframe to screens: rather than one page with a lot of information, the dashboard was divided into two, each built around a main visualization. It first showed only overall drone stats, then added the option to look at individual drone information.">
      <img data-reveal class="case__media" src="assets/images/drop/08-home-screen.jpg" width="2044" height="1150" alt="Home Screen: provides critical metrics at a glance, gives easy access to drone location and other details, and shows drone status distribution clearly. Callouts point to the interactive map, main KPIs, drone info table, status bar chart and secondary KPIs.">
      <img data-reveal class="case__media" src="assets/images/drop/09-drone-screen.jpg" width="2044" height="1150" alt="Drone Screen: shows specific flight and delivery information, highlights time-sensitive details, and shows performance and drone health in a scannable format. Callouts point to the quick view map, currently carrying table, key delivery information, performance-over-time line charts, and battery and maintenance details.">
      <img data-reveal class="case__media" src="assets/images/drop/10-delivery-screen.jpg" width="2044" height="1150" alt="Delivery Screen: shows delivery and efficiency metrics, compares deliveries completed by each drone, and visualizes demand for deliveries over time. Callouts point to delivery KPIs, deliveries over time, profit, and a comparison of deliveries by drone.">
